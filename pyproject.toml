[project]
name = "ril"
version = "0.0.0"
description = "Repository Intelligence Layer: repository-level code retrieval and a study of retriever supervision."
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pystemmer>=2.2",
]

[tool.poetry]
packages = [{ include = "ril" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-cov = ">=5.0"
ruff = ">=0.6"
mypy = ">=1.10"
types-pyyaml = ">=6.0"
jedi = ">=0.19"
pyarrow = ">=15.0"
networkx = ">=3.0"
rustworkx = ">=0.14"
kuzu = ">=0.4"
bm25s = ">=0.2"

# Training stack (ril/training/) and its torch tests; the same torch version as the cluster's GPU
# environment (docs/COMPUTE.md). Optional: installed only by `make setup-train`, on Ada; the local
# machine (8 GB) never installs it.
[tool.poetry.group.train]
optional = true

[tool.poetry.group.train.dependencies]
torch = "2.4.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# torch tests skip at import when torch is absent, before the project imports
"tests/unit/test_train_measure.py" = ["E402"]
"tests/unit/test_contrastive_loss.py" = ["E402"]
"tests/unit/test_arms_only_differ_through_hooks.py" = ["E402"]
"tests/unit/test_noise_arms.py" = ["E402"]
"tests/integration/test_training_end_to_end.py" = ["E402"]
"tests/integration/test_curve_hook.py" = ["E402"]
"tests/reproducibility/test_training_repro.py" = ["E402"]
"tests/unit/test_retention_training.py" = ["E402"]
[tool.ruff.lint.isort]
known-first-party = ["ril"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ril"]

[[tool.mypy.overrides]]
# comparator and storage libraries without type information
module = ["networkx", "pyarrow", "pyarrow.*", "rustworkx", "kuzu", "jedi", "Stemmer", "bm25s"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# torch is an optional group (Ada only); locally the training modules are checked without it
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running tests excluded from `make test`",
    "torch: tests that import torch, train or encode; run on Ada only (`make test-all`)",
]
