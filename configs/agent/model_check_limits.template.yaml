# Limits, prices and caps of the model check across providers (D152). NOT filled in.
# Copy it, fill in every UNSET value from the provider's own console and pricing page on the day of the
# run, and validate it with `scripts/rq3_driver.py model-check-limits FILE` (no key read, no call).
# A candidate with an unset value is refused before any call. Third-party price lists are not used.
# `provisional: ADR-008`. Keep `margin` below 1 so the run stays inside the console's figures.
as_of: "UNSET"                 # date the limits and prices were read
source: "UNSET"                # provider consoles / pricing pages (names, not credentials)
timezone: "America/Los_Angeles"
margin: 0.9
study_budget_usd: 150          # B of the rule; 150 applies if this key is removed (the entry says which applied)
study_arm_runs: 12             # arm-runs of the analysis plan (4 arms x k = 3, the largest grid of the cost model)
confirmatory_n: 327            # instances per arm-run
models:
  # provider: gemini | messages (a messages-style chat API; then api_url, key_variable, key_header and
  # extra_headers, for example a version header, are required: they are the provider's own, from its documentation).
  # The two `second-provider-model-*` keys are placeholders: replace them with the two model strings of D152.
  # rpm / tpm / rpd: the billed tier's limits (use a large rpd where the
  # provider has no daily request limit).  input_per_m / output_per_m: USD per million tokens (billed
  # output includes thinking tokens).  thinking: the provider's lowest fixed setting that the scaffold
  # works with, sent verbatim (Gemini: generationConfig.thinkingConfig; messages provider: the `thinking` field);
  # null sends nothing.  caps_usd: ascending cap tiers; run the first, and resume with the next only if
  # the run stopped on the spend cap.
  gemini-3.5-flash-lite:
    provider: gemini
    tier: "UNSET"
    rpm: 0
    tpm: 0
    rpd: 0
    input_per_m: 0
    output_per_m: 0
    price_as_of: "UNSET"
    price_source: "UNSET"
    thinking: null
    caps_usd: [1, 3]
  gemini-3.8-flash:
    provider: gemini
    tier: "UNSET"
    rpm: 0
    tpm: 0
    rpd: 0
    input_per_m: 0
    output_per_m: 0
    price_as_of: "UNSET"
    price_source: "UNSET"
    thinking: null
    caps_usd: [3, 8]
  second-provider-model-a:
    provider: messages
    api_url: "UNSET"
    key_variable: "UNSET"
    key_header: "UNSET"
    extra_headers: {}
    tier: "UNSET"
    rpm: 0
    tpm: 0
    rpd: 0
    input_per_m: 0
    output_per_m: 0
    price_as_of: "UNSET"
    price_source: "UNSET"
    thinking: null
    caps_usd: [3, 8]
  second-provider-model-b:
    provider: messages
    api_url: "UNSET"
    key_variable: "UNSET"
    key_header: "UNSET"
    extra_headers: {}
    tier: "UNSET"
    rpm: 0
    tpm: 0
    rpd: 0
    input_per_m: 0
    output_per_m: 0
    price_as_of: "UNSET"
    price_source: "UNSET"
    thinking: null
    caps_usd: [5, 15]
