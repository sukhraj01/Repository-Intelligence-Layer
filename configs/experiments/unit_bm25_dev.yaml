experiment_id: E-FREEZE-AND-LATENCY unit-level BM25 variants (decision D119)
stage: stated cells on the development role only (no test instance); the rule below is fixed before any variant row is read
status: exploratory
date: '2026-11-10'
seed: 0
roles:
- dev
control: control
rrf_k: 100
dense: coderankembed__t1024
reading: units_all_nomod (D18), units_all beside it
note: >-
  Unit texts are rebuilt at each base commit with the parser of the instance cache; the control cell
  (reference tokenisation of the unit source, k1 1.5, b 0.75) must reproduce the cache's stored BM25
  scores bit for bit on every level of every instance, or the instance is not evaluated and is listed.
  One factor changes per cell: identifier splitting (whole identifier kept or dropped), k1 (0.9, 2.0),
  b (0.4, 0.9), integer field weights added to the body (name twice; path once; name twice, signature
  once, path once). The dense scores are the stored CodeRankEmbed 1,024-token scores of E-DENSE-FUSION
  and the RRF k is the dev selection (100); no expansion and no recency prior are included.
rule: >-
  Fixed before the run. Intervals: cluster-robust t over repositories (R - 1 degrees of freedom), the
  repository bootstrap beside it; L3 is two repositories and therefore query-level, labelled so.
  Best variant: the non-control cell with the highest mean L2 nDCG@10 of BM25 alone. Reading of the
  fusion: the best variant "changes the fusion" if its RRF difference to the control RRF at L2 nDCG@10
  has a t interval above 0; the same is reported at L3 Recall@100 (query level) and for every other
  cell. A cell whose alone-gain does not survive inside the fusion is reported as such. Nothing is
  selected for a frozen configuration by this run.
