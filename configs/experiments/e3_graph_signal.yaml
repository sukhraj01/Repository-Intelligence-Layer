note: >-
  Graph expansion from the top-C BM25 units over the unit index of the snapshot at the base commit.
  Sweeps run on role dev only (Pro openlibrary and qutebrowser; Live conan, haystack, streamlink; the
  split is fixed in e1_bm25_reproduction.yaml). BM25 is the reference form (k1 1.5, b 0.75, module unit
  in the index), seeds are retrieved units, never gold. Two ways to form the scored list are reported
  side by side and neither is chosen (open question Q30): 'list' (seeds, expansion in score order,
  then the rest of the BM25 list) and 'rrf' (the expansion as a second ranked list, fused with the BM25
  list by reciprocal rank fusion, k = 60). The expansion keeps at most 50 units (an implementation
  limit so that a hub does not flood the list; not tuned). inherit includes override; co_change has
  support 3; tests, configures and co_change are exploratory families.
