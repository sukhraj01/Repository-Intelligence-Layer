# RQ2 final experiment run (rendered from the cell table by scripts/rq2_plan.py render; do not edit by hand).
exp_id: rq2f_mined_sub
rq: rq2
label: RQ2 final, mined_sub, seed 101, 100 updates (confirmatory)
provisional:
- ADR-001
- ADR-002
- ADR-006
seed: 101
pool:
  source: 'PR-mined set, full run on account C (E-MINE-FULL): every directory of the non_test reading (no test-file function
    in the corpora, no test positive), after the held-out filter and the content-overlap drop list'
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: every directory of the reading that survives the held-out filter and the overlap drop list and has BM25 ranks
    (select_job, seed 0, no maximum)
  include_held_out: false
  max_instances: null
  selection_seed: 0
  text_form: code
  feature_table: features_mined.csv (BM25 K-ranks of the full mined store under the published rank definition, 1,024 tokens;
    prep job on account C)
model:
  kind: sentence_transformers
  encoder: coderankembed
  max_tokens: 512
  gradient_checkpointing: true
batch:
  batch_size: 32
  negatives_per_example: 1
  max_positives: 1
negatives:
  name: random_repo
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
optimizer:
  name: adamw
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_updates: 7
  schedule: linear
  grad_clip: 1.0
  precision: amp_fp16
budget:
  updates: 3000
  stop_after: 100
checkpoint:
  every: 100
  keep: 1
  log_every: 10
  final_dtype: float16
  retain_final: true
arm:
  name: RAW_SUBSAMPLE
  subsample:
    size: filter_size
    draw: 0
evaluation:
  roles:
  - dev
  rrf_k: 60
  batch_size: 64
  chunks: false
  seed: 0
  baselines: []
