# RQ2 final experiment run (rendered from the cell table by scripts/rq2_plan.py render; do not edit by hand).
exp_id: rq2f_inj_oracle
rq: rq2
label: RQ2 final, inj_oracle, seed 102, 100 updates (control)
provisional:
- ADR-001
- ADR-002
- ADR-006
seed: 102
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: first 5,000 directories outside the held-out list by sha256("0:<directory>") = selection A (first 2,000) plus
    the next 3,000 (cache pool_A + pool_T3x)
  include_held_out: false
  max_instances: 5000
  selection_seed: 0
  text_form: code
  feature_table: p0_features_5000.csv (K-ranks of the 5,000 directories under CodeRankEmbed and SweRankEmbed-Small at 1,024
    tokens and BM25; teacher passes of 2026-10-25 and 2026-10-31)
model:
  kind: sentence_transformers
  encoder: coderankembed
  max_tokens: 512
  gradient_checkpointing: true
batch:
  batch_size: 32
  negatives_per_example: 1
  max_positives: 1
negatives:
  name: random_repo
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
optimizer:
  name: adamw
  lr: 2.0e-05
  weight_decay: 0.01
  warmup_updates: 7
  schedule: linear
  grad_clip: 1.0
  precision: amp_fp16
budget:
  updates: 3000
  stop_after: 100
checkpoint:
  every: 100
  keep: 1
  log_every: 10
  final_dtype: float16
  retain_final: false
noise:
  rate: 0.4
  scheme: same_snapshot_uniform
  version: noise-dose/v1
arm:
  name: ORACLE_CLEAN
evaluation:
  roles:
  - dev
  rrf_k: 60
  batch_size: 64
  chunks: false
  seed: 0
  baselines: []
