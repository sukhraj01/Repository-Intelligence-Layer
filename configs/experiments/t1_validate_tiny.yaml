# T1 training-stack validation on real pool directories with the CPU tiny model (not a retriever).
# Checks the path (reader, held-out and feature-table selection, BM25 mining, FILTER hook, matched
# updates, checkpoints, evaluation hook on the X2 development preparation); no number from it is a
# result. Every training value below is a test value, not a proposal: provisional ADR-001, ADR-002,
# ADR-006; never in configs/frozen/.
exp_id: t1_validate_tiny
rq: rq2
label: training-stack validation, tiny model, exploratory
provisional: [ADR-001, ADR-002, ADR-006]
seed: 0
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  feature_table: results/tables/x3_pool_ranks_features.csv
  max_instances: 24
  selection_seed: 0
  text_form: code
model: {kind: tiny, buckets: 4096, dim: 32, max_tokens: 256}
batch: {batch_size: 8, negatives_per_example: 4, max_positives: 4}
negatives: {name: teacher_top_m, m: 16, mining_teacher: bm25, mining_keep: 64}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 0.01, weight_decay: 0.0, warmup_updates: 3, schedule: linear, grad_clip: 1.0}
budget: {updates: 30}
checkpoint: {every: 10, keep: 2, log_every: 1}
arm:
  name: FILTER
  filter: {teacher: coderankembed, k: 40, level: positive}
evaluation:
  roles: [dev]
  rrf_k: 60
  batch_size: 64
  chunks: true
  seed: 0
  baselines: [coderankembed__t512]
