  compatibility:
  - 'Separate environment from CPU evaluation: GPU NumPy 1.26.4 matches the recorded Ada encoding environment;
    CPU NumPy remains the project lock pin.'
  - CodeRankEmbed uses transformers 4.44.2, sentence-transformers 3.1.1 and tokenizers 0.19.1, matching
    the existing Ada compatibility overlay.
  - Torch 2.4.1 CUDA 12.1 uses the official PyTorch wheel index; a real CUDA matrix product must pass
    on the allocated card.
  - Exact pins resolve for Linux x86_64 and Python 3.11; this profile does not claim installation, CUDA
    support or model output parity on an actual Colab VM.
  - Install dependencies and acquire pinned model files on a CPU runtime before switching to a GPU runtime;
    never fall back to CPU model encoding.
  - UV first-index selection can reject otherwise available PyPI pins on the PyTorch index; use the declared
    index strategy with these complete exact requirements.
