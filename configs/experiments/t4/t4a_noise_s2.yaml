# E-PILOT-ARMS stage 1 (exploratory, labelled; outside the pre-registered RQ tables). Every value is a pilot
# value, provisional ADR-001, ADR-002, ADR-006, never in configs/frozen/. Same model, batch shape, loss, optimizer,
# negative policy (random repository-local, D28 primary) as the learning curve (configs/experiments/t3/); the
# schedule is that of 3,000 updates (warm-up 7, linear), the run is complete after budget.stop_after = 100 updates,
# which is the schedule the 100-update point of the curve had. Pool: selection A (2,000 directories), because the
# K-rank rows of all three teachers exist for it; the curve used 5,000. Only exp_id, label, seed and arm differ
# between cells.
exp_id: t4a_noise
rq: rq2
label: "E-PILOT-ARMS stage 1: NOISE control (D38): positives replaced by random functions of the same repository; N = 100 updates of a 3,000-update schedule"
provisional: [ADR-001, ADR-002, ADR-006]
seed: 2
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: first 2,000 directories outside the held-out list by sha256("0:<directory>") (selection A)
  include_held_out: false
  max_instances: 2000
  selection_seed: 0
  text_form: code
  feature_table: t2_features_A.csv (K-ranks of selection A under CodeRankEmbed and SweRankEmbed-Small at 1,024 tokens and BM25; teacher pass of 2026-10-25)
model: {kind: sentence_transformers, encoder: coderankembed, max_tokens: 512, gradient_checkpointing: true}
batch: {batch_size: 32, negatives_per_example: 1, max_positives: 1}
negatives: {name: random_repo}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 2.0e-5, weight_decay: 0.01, warmup_updates: 7, schedule: linear, grad_clip: 1.0, precision: amp_fp16}
budget: {updates: 3000, stop_after: 100}
checkpoint: {every: 100, keep: 1, log_every: 10, final_dtype: float16}
arm: {name: NOISE}
evaluation: {roles: [dev], rrf_k: 60, batch_size: 64, chunks: false, seed: 0, baselines: []}
