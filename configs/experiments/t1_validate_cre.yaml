# T1 training-stack validation of the released-checkpoint path (CodeRankEmbed, sentence-transformers)
# on the cluster CPU: a few updates on real pool directories, checkpoint and resume, half-precision
# final model, reload. Not a training run; no number from it is a result. Values are test values
# sized for a CPU: provisional ADR-001, ADR-002, ADR-006; never in configs/frozen/.
exp_id: t1_validate_cre
rq: rq2
label: training-stack validation, CodeRankEmbed path on CPU, exploratory
provisional: [ADR-001, ADR-002, ADR-006]
seed: 0
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  feature_table: results/tables/x3_pool_ranks_features.csv
  max_instances: 24
  selection_seed: 0
  text_form: code
model: {kind: sentence_transformers, encoder: coderankembed, max_tokens: 128}
batch: {batch_size: 2, negatives_per_example: 1, max_positives: 1}
negatives: {name: random_repo}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 2.0e-5, weight_decay: 0.01, warmup_updates: 1, schedule: linear, grad_clip: 1.0}
budget: {updates: 4}
checkpoint: {every: 2, keep: 1, log_every: 1, final_dtype: float16}
arm: {name: RAW}
