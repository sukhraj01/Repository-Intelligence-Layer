experiment_id: E-PILOT-CURVE-subset
status: exploratory pilot
date: '2026-10-29'
seed: 0
bm25:
  k1: 1.5
  b: 0.75
  stopwords: en (33 words)
  stemmer: snowball english
  token_pattern: (?u)\b\w\w+\b
  provisional: ADR-004
prefilter_k: 10000
metrics:
  ndcg_at: 10
  recall_at: 100
  gain: binary
  aggregation: mean over queries
bootstrap:
  draws: 2000
  interval: 95% percentile
  unit: queries
note: 'Subset of e1_bm25_dev3.yaml for the learning-curve evaluation: dev repositories
  openlibrary, qutebrowser (L2 and L3) and streamlink (L2); conan, haystack and ansible
  are dropped because their snapshot stores are 64% of the encoding time (about 43
  minutes per evaluation of the full dev set against the GPU budget). Folders and
  parameters are copied unchanged.'
