status: exploratory pilot
date: '2026-10-23'
seed: 0
note: 'Counts positives by kind and file novelty; no retrieval setting is chosen from these folders.
  The six Verified repositories without unit-level records so far and the one further Python
  repository with L3 qrels in the non-Verified sub-datasets (SWE-bench Pro ansible) are mapped with
  the pilot-E1 unit stage (same code, same BM25 parameters; the BM25 ranks it also writes are not
  used). Only instances with L3 qrels get metadata. Live has no L3 folders; Multi-SWE-bench and
  Multilingual are not Python and are out of scope.'
