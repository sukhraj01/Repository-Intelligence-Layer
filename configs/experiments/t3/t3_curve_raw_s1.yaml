# Learning curve (exploratory, E-PILOT-CURVE, docs/EXPERIMENTS.md). Stated before the run: every value
# is a pilot value, provisional ADR-001, ADR-002, ADR-006, never in configs/frozen/. Same model, batch
# shape, loss, optimizer, negative policy (random repository-local) and arm (RAW) as the smoke pilots
# (configs/experiments/t2/t2_k_raw_s0.yaml); only the budget (3,000 updates), the pool (5,000
# directories) and the evaluation at several update counts differ. One run per seed; the encoder is
# evaluated inside the run at curve.steps and the copies are deleted. The linear schedule is that of 3,000 updates; the run stops after curve.stop_after = 2,000 updates because one dev evaluation took 43 minutes (budget).
exp_id: t3_curve_raw
rq: rq2
label: "E-PILOT-CURVE: RAW, 3,000-update schedule stopped after 2,000 updates (GPU budget), evaluated at 0, 100, 300, 1000, 2000 updates"
provisional: [ADR-001, ADR-002, ADR-006]
seed: 1
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: first 5,000 directories outside the held-out list by sha256("0:<directory>") = selection A (first 2,000) plus the next 3,000 (cache pool_A + pool_T3x)
  include_held_out: false
  max_instances: 5000
  selection_seed: 0
  text_form: code
model: {kind: sentence_transformers, encoder: coderankembed, max_tokens: 512, gradient_checkpointing: true}
batch: {batch_size: 32, negatives_per_example: 1, max_positives: 1}
negatives: {name: random_repo}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 2.0e-5, weight_decay: 0.01, warmup_updates: 7, schedule: linear, grad_clip: 1.0, precision: amp_fp16}
budget: {updates: 3000}
checkpoint: {every: 100, keep: 1, log_every: 10, final_dtype: float16}
arm: {name: RAW}
curve: {steps: [0, 100, 300, 1000, 2000], stop_after: 2000}
evaluation: {roles: [dev], rrf_k: 60, batch_size: 64, chunks: false, seed: 0, baselines: []}
