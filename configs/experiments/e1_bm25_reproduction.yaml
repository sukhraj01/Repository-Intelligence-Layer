experiment_id: E-BM25-REPRO
status: exploratory pilot
date: '2026-10-18'
seed: 0
bm25:
  k1: 1.5
  b: 0.75
  stopwords: en (33 words)
  stemmer: snowball english
  token_pattern: (?u)\b\w\w+\b
  provisional: ADR-004
prefilter_k: 10000
metrics:
  ndcg_at: 10
  recall_at: 100
  gain: binary
  aggregation: mean over queries
bootstrap:
  draws: 2000
  interval: 95% percentile
  unit: queries
note: dev and test roles are fixed here before any run; the config hash covers them. Sweeps of k1 and
  b, if any, use role dev only; test repositories are used to confirm the stated setting (k1 1.5, b 0.75).
