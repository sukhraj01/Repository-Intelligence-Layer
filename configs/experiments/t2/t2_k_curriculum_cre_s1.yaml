# Smoke pilot (exploratory, E-PILOT-K / E-PILOT-NEG / E-PILOT-LEAK, docs/EXPERIMENTS.md). Stated before
# the run: every value is a pilot value, provisional ADR-001, ADR-002, ADR-006, never in configs/frozen/.
# Held identical across every condition of the pilots except where the comment of the pilot says:
# base, tokens, batch shape, loss, optimizer, matched update count (one pass over selection A at
# batch 32), evaluation. Only exp_id, label, seed, arm (E-PILOT-K), negatives (E-PILOT-NEG) and
# pool (E-PILOT-LEAK) differ between files.
exp_id: t2_k_curriculum_cre
rq: rq2
label: "E-PILOT-K: CURRICULUM, easy to hard by the example K-rank under coderankembed, 4 quantile buckets"
provisional: [ADR-001, ADR-002, ADR-006]
seed: 1
pool:
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member offsets)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: first 2,000 directories outside the held-out list by sha256("0:<directory>") (selection A)
  include_held_out: false
  max_instances: 2000
  selection_seed: 0
  text_form: code
  feature_table: t2_features_A.csv (K-ranks of selection A under CodeRankEmbed and SweRankEmbed-Small at 1,024 tokens and BM25; teacher pass of 2026-10-25)
model: {kind: sentence_transformers, encoder: coderankembed, max_tokens: 512, gradient_checkpointing: true}
batch: {batch_size: 32, negatives_per_example: 1, max_positives: 1}
negatives: {name: random_repo}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 2.0e-5, weight_decay: 0.01, warmup_updates: 7, schedule: linear, grad_clip: 1.0, precision: amp_fp16}
budget: {updates: 63}
checkpoint: {every: 63, keep: 1, log_every: 1, final_dtype: float16}
arm: {name: CURRICULUM, ordering: {teacher: coderankembed, buckets: 4}}
evaluation: {roles: [dev], rrf_k: 60, batch_size: 64, chunks: false, seed: 0, baselines: [coderankembed__t512]}
