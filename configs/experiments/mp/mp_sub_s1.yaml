# E-MINED-PILOT (exploratory, labelled; outside the pre-registered RQ tables). Every value is a pilot value,
# provisional ADR-001, ADR-002, ADR-006, never in configs/frozen/. Same model, batch shape, loss, optimizer,
# negative policy (random repository-local, D28 primary), schedule (3,000-update schedule, warm-up 7, linear,
# complete after budget.stop_after = 100 updates) and evaluation as the matched-pool arms pilot
# (configs/experiments/t5/): only the training pool changes (the PR-mined pilot set in the pool-like reading,
# after the held-out filter) and, for FILTER, the teacher table (BM25 only). Cells differ only in exp_id,
# label, seed and arm. RAW_SUBSAMPLE is the size-matched control of FILTER K = 20 (765 examples, one draw per seed).
exp_id: mp_sub
rq: rq2
label: "E-MINED-PILOT: RAW on a random subset of 765 examples (draw 0), the size FILTER K=20 BM25 leaves on the mined set; N = 100 updates of a 3,000-update schedule"
provisional: [ADR-001, ADR-002, ADR-006]
seed: 1
pool:
  source: "PR-mined pilot run (E-MINE-PILOT M2: 200 repositories, 2,000 attempted pull requests), pool-like reading (no test-file function in the corpora, no test positive; async def functions stay as in M3)"
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with data/held_out/rename_cache.json
  selection: every directory of the reading that survives the held-out filter and has BM25 ranks (select_job, seed 0, no maximum)
  include_held_out: false
  max_instances: null
  selection_seed: 0
  text_form: code
  feature_table: "features_mined.csv (BM25 K-ranks of the mined directories under the published rank definition, 1,024 tokens; scripts/ada/mp_prep.sbatch)"
model: {kind: sentence_transformers, encoder: coderankembed, max_tokens: 512, gradient_checkpointing: true}
batch: {batch_size: 32, negatives_per_example: 1, max_positives: 1}
negatives: {name: random_repo}
loss: {form: sum_in_numerator, normaliser: batch, temperature: 0.05}
optimizer: {name: adamw, lr: 2.0e-5, weight_decay: 0.01, warmup_updates: 7, schedule: linear, grad_clip: 1.0, precision: amp_fp16}
budget: {updates: 3000, stop_after: 100}
checkpoint: {every: 100, keep: 1, log_every: 10, final_dtype: float16}
arm: {name: RAW_SUBSAMPLE, subsample: {size: 765, draw: 0}}
evaluation: {roles: [dev], rrf_k: 60, batch_size: 64, chunks: false, seed: 0, baselines: []}
