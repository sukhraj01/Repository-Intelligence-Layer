experiment_id: E-BM25-REPRO-L2
status: exploratory pilot
date: '2026-10-18'
seed: 0
bm25:
  k1: 1.5
  b: 0.75
  stopwords: en (33 words)
  stemmer: snowball english
  token_pattern: (?u)\b\w\w+\b
  provisional: ADR-004
prefilter_k: 10000
metrics:
  ndcg_at: 10
  recall_at: 100
  gain: binary
  aggregation: mean over queries
bootstrap:
  draws: 2000
  interval: 95% percentile
  unit: queries
note: 'Chunk-level BM25 over every original L2 folder (632 folders, 5,061 queries), to compare with the
  benchmark card average. Folders are fetched one at a time and deleted after scoring. A dot in a folder name is written %2E and decoded on load. No tuning: parameters
  are the reference defaults.'
