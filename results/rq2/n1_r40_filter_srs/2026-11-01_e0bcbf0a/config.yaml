arm:
  filter:
    k: 20
    level: positive
    teacher: swerankembed-small
  name: FILTER
batch:
  batch_size: 32
  max_positives: 1
  negatives_per_example: 1
budget:
  stop_after: 100
  updates: 3000
checkpoint:
  every: 100
  final_dtype: float16
  keep: 1
  log_every: 10
evaluation:
  baselines: []
  batch_size: 64
  chunks: false
  roles:
  - dev
  rrf_k: 60
  seed: 0
exp_id: n1_r40_filter_srs
label: 'E-PILOT-NOISE r=0.4: FILTER K=20, teacher SweRankEmbed-Small; N = 100 updates
  of a 3,000-update schedule'
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
model:
  encoder: coderankembed
  gradient_checkpointing: true
  kind: sentence_transformers
  max_tokens: 512
negatives:
  name: random_repo
noise:
  rate: 0.4
  scheme: same_snapshot_uniform
  version: noise-dose/v1
optimizer:
  grad_clip: 1.0
  lr: 2.0e-05
  name: adamw
  precision: amp_fp16
  schedule: linear
  warmup_updates: 7
  weight_decay: 0.01
pool:
  feature_table: p0_features_5000.csv (K-ranks of the 5,000 directories under CodeRankEmbed
    and SweRankEmbed-Small at 1,024 tokens and BM25; teacher passes of 2026-10-25
    and 2026-10-31)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with
    data/held_out/rename_cache.json
  include_held_out: false
  max_instances: 5000
  selection: first 5,000 directories outside the held-out list by sha256("0:<directory>")
    = selection A (first 2,000) plus the next 3,000 (cache pool_A + pool_T3x)
  selection_seed: 0
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member
    offsets)
  text_form: code
provisional:
- ADR-001
- ADR-002
- ADR-006
rq: rq2
seed: 0
