arm:
  name: RAW_SUBSAMPLE
  subsample:
    draw: 0
    size: 765
batch:
  batch_size: 32
  max_positives: 1
  negatives_per_example: 1
budget:
  stop_after: 100
  updates: 3000
checkpoint:
  every: 100
  final_dtype: float16
  keep: 1
  log_every: 10
evaluation:
  baselines: []
  batch_size: 64
  chunks: false
  roles:
  - dev
  rrf_k: 60
  seed: 0
exp_id: mp_sub
label: 'E-MINED-PILOT: RAW on a random subset of 765 examples (draw 0), the size FILTER
  K=20 BM25 leaves on the mined set; N = 100 updates of a 3,000-update schedule'
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
model:
  encoder: coderankembed
  gradient_checkpointing: true
  kind: sentence_transformers
  max_tokens: 512
negatives:
  name: random_repo
optimizer:
  grad_clip: 1.0
  lr: 2.0e-05
  name: adamw
  precision: amp_fp16
  schedule: linear
  warmup_updates: 7
  weight_decay: 0.01
pool:
  feature_table: features_mined.csv (BM25 K-ranks of the mined directories under the
    published rank definition, 1,024 tokens; scripts/ada/mp_prep.sbatch)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with
    data/held_out/rename_cache.json
  include_held_out: false
  max_instances: null
  selection: every directory of the reading that survives the held-out filter and
    has BM25 ranks (select_job, seed 0, no maximum)
  selection_seed: 0
  source: 'PR-mined pilot run (E-MINE-PILOT M2: 200 repositories, 2,000 attempted
    pull requests), pool-like reading (no test-file function in the corpora, no test
    positive; async def functions stay as in M3)'
  text_form: code
provisional:
- ADR-001
- ADR-002
- ADR-006
rq: rq2
seed: 1
