arm:
  filter:
    k: 40
    level: positive
    teacher: coderankembed
  name: FILTER
batch:
  batch_size: 8
  max_positives: 4
  negatives_per_example: 4
budget:
  updates: 30
checkpoint:
  every: 10
  keep: 2
  log_every: 1
evaluation:
  baselines:
  - coderankembed__t512
  batch_size: 64
  chunks: true
  roles:
  - dev
  rrf_k: 60
  seed: 0
exp_id: t1_validate_tiny
label: training-stack validation, tiny model, exploratory
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
model:
  buckets: 4096
  dim: 32
  kind: tiny
  max_tokens: 256
negatives:
  m: 16
  mining_keep: 64
  mining_teacher: bm25
  name: teacher_top_m
optimizer:
  grad_clip: 1.0
  lr: 0.01
  name: adamw
  schedule: linear
  warmup_updates: 3
  weight_decay: 0.0
pool:
  feature_table: results/tables/x3_pool_ranks_features.csv
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with
    data/held_out/rename_cache.json
  max_instances: 24
  selection_seed: 0
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member
    offsets)
  text_form: code
provisional:
- ADR-001
- ADR-002
- ADR-006
rq: rq2
seed: 0
