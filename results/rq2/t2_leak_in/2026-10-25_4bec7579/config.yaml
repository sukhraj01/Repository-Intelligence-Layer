arm:
  name: RAW
batch:
  batch_size: 32
  max_positives: 1
  negatives_per_example: 1
budget:
  updates: 63
checkpoint:
  every: 63
  final_dtype: float16
  keep: 1
  log_every: 1
evaluation:
  baselines:
  - coderankembed__t512
  batch_size: 64
  chunks: false
  roles:
  - dev
  rrf_k: 60
  seed: 0
exp_id: t2_leak_in
label: 'E-PILOT-LEAK: RAW on selection L (held-out repositories not removed); against
  t2_k_raw'
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
model:
  encoder: coderankembed
  gradient_checkpointing: true
  kind: sentence_transformers
  max_tokens: 512
negatives:
  name: random_repo
optimizer:
  grad_clip: 1.0
  lr: 2.0e-05
  name: adamw
  precision: amp_fp16
  schedule: linear
  warmup_updates: 7
  weight_decay: 0.01
pool:
  feature_table: none (RAW only)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with
    data/held_out/rename_cache.json
  include_held_out: true
  max_instances: 2000
  selection: first 2,000 directories of the whole listing by sha256("0:<directory>"),
    held-out repositories included (selection L, leakage pilot only)
  selection_seed: 0
  source: gangiswag/train_data train.zip, train/python (listing of 2026-10-17, member
    offsets)
  text_form: code
provisional:
- ADR-001
- ADR-002
- ADR-006
rq: rq2
seed: 1
