arm:
  filter:
    k: 20
    level: positive
    teacher: bm25
  name: FILTER
batch:
  batch_size: 32
  max_positives: 1
  negatives_per_example: 1
budget:
  stop_after: 100
  updates: 3000
checkpoint:
  every: 100
  final_dtype: float16
  keep: 1
  log_every: 10
  retain_final: true
evaluation:
  baselines: []
  batch_size: 64
  chunks: false
  roles:
  - dev
  rrf_k: 60
  seed: 0
exp_id: rq2f_mined_filter_bm25
label: RQ2 final, mined_filter_bm25, seed 102, 100 updates (confirmatory)
loss:
  form: sum_in_numerator
  normaliser: batch
  temperature: 0.05
model:
  encoder: coderankembed
  gradient_checkpointing: true
  kind: sentence_transformers
  max_tokens: 512
negatives:
  name: random_repo
optimizer:
  grad_clip: 1.0
  lr: 2.0e-05
  name: adamw
  precision: amp_fp16
  schedule: linear
  warmup_updates: 7
  weight_decay: 0.01
pool:
  feature_table: features_mined.csv (BM25 K-ranks of the full mined store under the
    published rank definition, 1,024 tokens; prep job on account C)
  held_out: data/held_out/held_out_repos.json (v2, core plus Loc-Bench tier) with
    data/held_out/rename_cache.json
  include_held_out: false
  max_instances: null
  selection: every directory of the reading that survives the held-out filter and
    the overlap drop list and has BM25 ranks (select_job, seed 0, no maximum)
  selection_seed: 0
  source: 'PR-mined set, full run on account C (E-MINE-FULL): every directory of the
    non_test reading (no test-file function in the corpora, no test positive), after
    the held-out filter and the content-overlap drop list'
  text_form: code
provisional:
- ADR-001
- ADR-002
- ADR-006
rq: rq2
seed: 102
